name: Test (python-tool)

on:
  push:
    branches: [main]
    paths: ['python-tool/**', '.github/workflows/python-tool-test.yml']
  pull_request:
    paths: ['python-tool/**', '.github/workflows/python-tool-test.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python-tool

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run safe core tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q .
